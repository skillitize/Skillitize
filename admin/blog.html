<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Skillitize - Blog Management</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7fb;
    color: #1f2937;
}

.container {
    width: min(1200px, calc(100% - 40px));
    margin: 35px auto 60px;
}

.page-title {
    margin-bottom: 25px;
}

.page-title h2 {
    margin: 0 0 8px;
    font-size: 30px;
    color: #111827;
}

.page-title p {
    margin: 0;
    color: #64748b;
    font-size: 15px;
}

.card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 25px;
    margin-bottom: 25px;
    box-shadow: 0 4px 15px rgba(15, 23, 42, 0.06);
}

.card h3 {
    margin: 0 0 22px;
    font-size: 20px;
    color: #111827;
}

.form-group {
    margin-bottom: 20px;
}

.form-group > label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: 600;
    color: #374151;
}

.form-group input[type="text"],
.form-group input[type="url"],
.form-group textarea {
    width: 100%;
    border: 1px solid #d1d5db;
    border-radius: 7px;
    padding: 11px 12px;
    font-family: inherit;
    font-size: 14px;
    color: #111827;
    background: #fff;
    outline: none;
}

.form-group input:focus,
.form-group textarea:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.10);
}

.form-group textarea {
    min-height: 110px;
    resize: vertical;
}

.slug-row {
    display: flex;
    gap: 10px;
}

.slug-row input {
    flex: 1;
}

.generate-btn,
.save-btn,
.cancel-btn,
.edit-btn,
.toggle-btn,
.delete-btn {
    border: none;
    border-radius: 6px;
    padding: 10px 15px;
    font-weight: 600;
    cursor: pointer;
}

.generate-btn {
    background: #eef2ff;
    color: #4338ca;
}

.generate-btn:hover {
    background: #e0e7ff;
}

.publish-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 5px 0 22px;
}

.publish-row input {
    width: 17px;
    height: 17px;
}

.publish-row label {
    font-size: 14px;
    color: #374151;
}

.form-buttons {
    display: flex;
    gap: 10px;
}

.save-btn {
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: #fff;
}

.save-btn:hover {
    opacity: .92;
}

.save-btn:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.cancel-btn {
    background: #e5e7eb;
    color: #374151;
}

.message {
    margin-top: 12px;
    font-size: 14px;
    color: #2563eb;
}

.blogs-table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 760px;
}

th, td {
    text-align: left;
    padding: 13px 12px;
    border-bottom: 1px solid #e5e7eb;
    font-size: 14px;
    vertical-align: middle;
}

th {
    background: #f8fafc;
    color: #475569;
    font-weight: 700;
}

td {
    color: #475569;
}

.status {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
}

.status.published {
    background: #dcfce7;
    color: #166534;
}

.status.draft {
    background: #fef3c7;
    color: #92400e;
}

.action-buttons {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.edit-btn {
    background: #dbeafe;
    color: #1d4ed8;
}

.toggle-btn {
    background: #ede9fe;
    color: #6d28d9;
}

.delete-btn {
    background: #fee2e2;
    color: #b91c1c;
}

.empty-message {
    text-align: center;
    padding: 25px;
    color: #94a3b8;
}

<style>
.editor-wrap { border: 1px solid #d1d5db; border-radius: 8px; overflow: hidden; background: white; }
.editor-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding: 10px; background: #f8fafc; border-bottom: 1px solid #e5e7eb; }
.editor-btn, .editor-select { border: 1px solid #d1d5db; background: white; color: #1f2937; border-radius: 5px; padding: 7px 10px; font-size: 13px; cursor: pointer; }
.editor-btn:hover, .editor-select:hover { background: #f1f5f9; border-color: #94a3b8; }
.editor-btn:active { transform: translateY(1px); }
.editor-select { min-width: 125px; }
.toolbar-divider { width: 1px; height: 25px; background: #d1d5db; margin: 0 3px; }
.rich-editor { min-height: 320px; padding: 16px; outline: none; font-size: 16px; line-height: 1.7; color: #1f2937; overflow-y: auto; }
.rich-editor:empty::before { content: attr(data-placeholder); color: #9ca3af; pointer-events: none; }
.rich-editor p { margin: 0 0 12px; }
.rich-editor h2, .rich-editor h3, .rich-editor h4 { margin: 18px 0 10px; line-height: 1.3; }
.rich-editor h2 { font-size: 26px; } .rich-editor h3 { font-size: 22px; } .rich-editor h4 { font-size: 19px; }
.rich-editor ul, .rich-editor ol { margin: 8px 0 14px 25px; }
.rich-editor blockquote { margin: 15px 0; padding: 10px 15px; border-left: 4px solid #7c3aed; background: #f8fafc; color: #475569; }
.rich-editor a { color: #2563eb; text-decoration: underline; }
.editor-help { display: block; margin-top: 7px; color: #64748b; font-size: 12px; }
@media (max-width: 700px) { .editor-toolbar { gap: 5px; padding: 8px; } .editor-btn, .editor-select { padding: 6px 8px; font-size: 12px; } .rich-editor { min-height: 280px; } }

.header {
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: white;
    padding: 20px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header h1 {
    font-size: 24px;
    margin: 0;
}

.header-buttons {
    display: flex;
    gap: 10px;
}

.header button {
    border: none;
    padding: 10px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
}

.back-btn {
    background: white;
    color: #333;
}

.logout-btn {
    background: #ef4444;
    color: white;
}

@media (max-width: 700px) {
    .header {
        padding: 15px;
        flex-direction: column;
        gap: 15px;
        align-items: flex-start;
    }
}

@media (max-width: 700px) {
    .container {
        width: calc(100% - 20px);
        margin-top: 20px;
    }

    .card {
        padding: 16px;
    }

    .page-title h2 {
        font-size: 25px;
    }

    .slug-row {
        flex-direction: column;
    }

    .form-buttons {
        flex-direction: column;
    }

    .form-buttons button {
        width: 100%;
    }
}
</style>

</head>

<body>


<!-- ==========================
     HEADER
========================== -->

<header class="header">

    <h1>SKILLITIZE Admin</h1>

    <div class="header-buttons">

        <button
            class="back-btn"
            onclick="goDashboard()">
            Dashboard
        </button>

        <button
            class="logout-btn"
            onclick="logout()">
            Logout
        </button>

    </div>

</header>



<!-- ==========================
     MAIN
========================== -->

<main class="container">


    <div class="page-title">

        <h2>Blog Management</h2>

        <p>
            Create, edit, publish and manage Skillitize articles.
        </p>

    </div>



    <!-- ==========================
         BLOG FORM
    ========================== -->

    <section class="card">

        <h3 id="formTitle">
            Create New Blog
        </h3>


        <form id="blogForm">


            <!-- BLOG ID -->

            <input
                type="hidden"
                id="blogId"
                value="">


            <!-- TITLE -->

            <div class="form-group">

                <label for="title">
                    Blog Title
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Enter blog title"
                    required>

            </div>



            <!-- SLUG -->

            <div class="form-group">

                <label for="slug">
                    Slug
                </label>

                <div class="slug-row">

                    <input
                        type="text"
                        id="slug"
                        placeholder="blog-title"
                        required>

                    <button
                        type="button"
                        class="generate-btn"
                        id="generateSlug">
                        Generate
                    </button>

                </div>

            </div>



            <!-- SUMMARY -->

            <div class="form-group">

                <label for="summary">
                    Summary
                </label>

                <textarea
                    id="summary"
                    placeholder="Short description of the blog"
                    style="min-height:100px;"
                    required></textarea>

            </div>



            <!-- CONTENT -->

            <div class="form-group">

                <label for="content">
                    Blog Content
                </label>

                <div class="editor-wrap">
                    <div class="editor-toolbar" role="toolbar" aria-label="Blog content formatting">
                        <button type="button" class="editor-btn" data-command="bold" title="Bold"><strong>B</strong></button>
                        <button type="button" class="editor-btn" data-command="italic" title="Italic"><em>I</em></button>
                        <button type="button" class="editor-btn" data-command="underline" title="Underline"><u>U</u></button>
                        <span class="toolbar-divider"></span>
                        <select class="editor-select" id="formatBlock" title="Text style">
                            <option value="p">Paragraph</option>
                            <option value="h2">Heading 2</option>
                            <option value="h3">Heading 3</option>
                            <option value="h4">Heading 4</option>
                            <option value="blockquote">Quote</option>
                        </select>
                        <span class="toolbar-divider"></span>
                        <button type="button" class="editor-btn" data-command="insertUnorderedList" title="Bullet list">• List</button>
                        <button type="button" class="editor-btn" data-command="insertOrderedList" title="Numbered list">1. List</button>
                        <span class="toolbar-divider"></span>
                        <button type="button" class="editor-btn" data-command="justifyLeft" title="Align left">Left</button>
                        <button type="button" class="editor-btn" data-command="justifyCenter" title="Align center">Center</button>
                        <button type="button" class="editor-btn" data-command="justifyRight" title="Align right">Right</button>
                        <span class="toolbar-divider"></span>
                        <button type="button" class="editor-btn" id="addLink" title="Add hyperlink">🔗 Link</button>
                        <button type="button" class="editor-btn" id="removeLink" title="Remove hyperlink">Unlink</button>
                        <span class="toolbar-divider"></span>
                        <button type="button" class="editor-btn" data-command="removeFormat" title="Clear formatting">Clear</button>
                    </div>
                    <div id="content" class="rich-editor" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Write the complete blog content here..."></div>
                </div>
                <small class="editor-help">Select text and use the toolbar to format it or add hyperlinks.</small>

            </div>



            <!-- IMAGE -->

            <div class="form-group">

                <label for="imageUrl">
                    Image URL
                </label>

                <input
                    type="url"
                    id="imageUrl"
                    placeholder="https://example.com/image.jpg">

            </div>



            <!-- PUBLISH -->

            <div class="publish-row">

                <input
                    type="checkbox"
                    id="isPublished"
                    checked>

                <label for="isPublished">
                    Publish this article
                </label>

            </div>



            <!-- BUTTONS -->

            <div class="form-buttons">

                <button
                    type="submit"
                    class="save-btn"
                    id="saveButton">
                    Create Blog
                </button>

                <button
                    type="button"
                    class="cancel-btn"
                    id="cancelEdit"
                    style="display:none;">
                    Cancel Edit
                </button>

            </div>


            <div
                class="message"
                id="formMessage">
            </div>


        </form>

    </section>



    <!-- ==========================
         EXISTING BLOGS
    ========================== -->

    <section class="card">

        <h3>
            Existing Blogs
        </h3>


        <div class="blogs-table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            Title
                        </th>

                        <th>
                            Slug
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Date
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                </thead>


                <tbody id="blogsTableBody">

                    <tr>

                        <td
                            colspan="5"
                            class="empty-message">
                            Loading blogs...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>


</main>



<!-- ==========================
     JAVASCRIPT
========================== -->

<script>

    /* ==========================
       API
    ========================== */

    const API_BASE =
        "https://api.skillitize.com";


    const API = {

        GET:
            API_BASE +
            "/blog/get_posts.php",

        CREATE:
            API_BASE +
            "/blog/create_post.php",

        UPDATE:
            API_BASE +
            "/blog/update_post.php",

        DELETE:
            API_BASE +
            "/blog/delete_post.php"

    };


    /* ==========================
       AUTHENTICATION
    ========================== */

    const token =
        localStorage.getItem(
            "skillitize_admin_token"
        );


    if (!token) {

        window.location.href =
            "index.html";

    }


    /* ==========================
       ELEMENTS
    ========================== */

    const blogForm =
        document.getElementById("blogForm");

    const blogId =
        document.getElementById("blogId");

    const title =
        document.getElementById("title");

    const slug =
        document.getElementById("slug");

    const summary =
        document.getElementById("summary");

    const content =
        document.getElementById("content");

    const imageUrl =
        document.getElementById("imageUrl");

    const isPublished =
        document.getElementById("isPublished");

    const blogsTableBody =
        document.getElementById("blogsTableBody");

    const formTitle =
        document.getElementById("formTitle");

    const saveButton =
        document.getElementById("saveButton");

    const cancelEdit =
        document.getElementById("cancelEdit");

    const formMessage =
        document.getElementById("formMessage");


    let blogs = [];



    /* ==========================
       GENERATE SLUG
    ========================== */

    document
        .getElementById("generateSlug")
        .addEventListener("click", () => {

            slug.value =
                createSlug(title.value);

        });


    function createSlug(text) {

        return text
            .toLowerCase()
            .trim()
            .replace(/[^a-z0-9\s-]/g, "")
            .replace(/\s+/g, "-")
            .replace(/-+/g, "-");

    }



    /* ==========================
       LOAD BLOGS
    ========================== */

    async function loadBlogs() {

        try {

            const response =
                await fetch(API.GET, {
                    method: "GET",
                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                });


            if (!response.ok) {

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }


            const result =
                await response.json();


            console.log(
                "Blogs response:",
                result
            );


            if (Array.isArray(result)) {

                blogs = result;

            } else if (
                Array.isArray(result.posts)
            ) {

                blogs = result.posts;

            } else if (
                Array.isArray(result.data)
            ) {

                blogs = result.data;

            } else {

                blogs = [];

            }


            renderBlogs();


        } catch (error) {

            console.error(
                "Load blogs error:",
                error
            );


            blogsTableBody.innerHTML = `
                <tr>
                    <td colspan="5" class="empty-message">
                        Unable to load blogs.
                    </td>
                </tr>
            `;

        }

    }



    /* ==========================
       RENDER BLOGS
    ========================== */

    function renderBlogs() {

        if (blogs.length === 0) {

            blogsTableBody.innerHTML = `
                <tr>
                    <td colspan="5" class="empty-message">
                        No blogs found.
                    </td>
                </tr>
            `;

            return;

        }


        blogsTableBody.innerHTML =
            blogs.map((blog, index) => {

                const published =
                    Number(blog.is_published) === 1 ||
                    blog.is_published === true;


                return `
                    <tr>

                        <td>
                            <strong>
                                ${escapeHtml(blog.title || "")}
                            </strong>
                        </td>

                        <td>
                            ${escapeHtml(blog.slug || "")}
                        </td>

                        <td>

                            <span class="status ${
                                published
                                    ? "published"
                                    : "draft"
                            }">

                                ${
                                    published
                                        ? "Published"
                                        : "Draft"
                                }

                            </span>

                        </td>

                        <td>
                            ${
                                blog.created_at
                                    ? new Date(
                                        blog.created_at
                                      ).toLocaleDateString()
                                    : "-"
                            }
                        </td>

                        <td>

                            <div class="action-buttons">

                                <button
                                    class="edit-btn"
                                    onclick="editBlog(${index})">
                                    Edit
                                </button>

                                <button
                                    class="toggle-btn"
                                    onclick="togglePublish(${index})">

                                    ${
                                        published
                                            ? "Unpublish"
                                            : "Publish"
                                    }

                                </button>

                                <button
                                    class="delete-btn"
                                    onclick="deleteBlog(${index})">
                                    Delete
                                </button>

                            </div>

                        </td>

                    </tr>
                `;

            }).join("");

    }



    /* ==========================
       CREATE / UPDATE BLOG
    ========================== */

    blogForm.addEventListener(
        "submit",
        async (e) => {

            e.preventDefault();


            const editing =
                blogId.value !== "";


            const data = {

                title:
                    title.value.trim(),

                slug:
                    slug.value.trim(),

                summary:
                    summary.value.trim(),

                content:
                    content.innerHTML.trim(),

                image_url:
                    imageUrl.value.trim(),

                is_published:
                    isPublished.checked ? 1 : 0

            };


            if (editing) {

                data.id =
                    blogId.value;

            }


            saveButton.disabled = true;

            saveButton.textContent =
                editing
                    ? "Updating..."
                    : "Creating...";

            formMessage.textContent = "";


            try {

                const response =
                    await fetch(
                        editing
                            ? API.UPDATE
                            : API.CREATE,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    "Bearer " +
                                    token
                            },

                            body:
                                JSON.stringify(data)
                        }
                    );


                const result =
                    await response.json();


                console.log(
                    "Save blog response:",
                    result
                );


                if (result.success) {

                    formMessage.textContent =
                        editing
                            ? "Blog updated successfully."
                            : "Blog created successfully.";


                    resetForm();

                    await loadBlogs();


                } else {

                    formMessage.textContent =
                        result.message ||
                        "Unable to save blog.";

                }


            } catch (error) {

                console.error(
                    "Save blog error:",
                    error
                );


                formMessage.textContent =
                    "Server error. Please try again.";

            }


            saveButton.disabled = false;

            saveButton.textContent =
                "Create Blog";

        }
    );



    /* ==========================
       EDIT BLOG
    ========================== */

    window.editBlog =
        function(index) {

            const blog =
                blogs[index];

            if (!blog) {
                return;
            }


            blogId.value =
                blog.id || "";

            title.value =
                blog.title || "";

            slug.value =
                blog.slug || "";

            summary.value =
                blog.summary || "";

            content.innerHTML =
                blog.content || "";

            imageUrl.value =
                blog.image_url ||
                blog.image ||
                "";

            isPublished.checked =
                Number(blog.is_published) === 1 ||
                blog.is_published === true;


            formTitle.textContent =
                "Edit Blog";

            saveButton.textContent =
                "Update Blog";

            cancelEdit.style.display =
                "inline-block";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        };



    /* ==========================
       CANCEL EDIT
    ========================== */

    cancelEdit.addEventListener(
        "click",
        () => {

            resetForm();

        }
    );



    function resetForm() {

        blogForm.reset();

        blogId.value = "";

        isPublished.checked = true;

        formTitle.textContent =
            "Create New Blog";

        saveButton.textContent =
            "Create Blog";

        cancelEdit.style.display =
            "none";

    }



    /* ==========================
       PUBLISH / UNPUBLISH
    ========================== */

    window.togglePublish =
        async function(index) {

            const blog =
                blogs[index];

            if (!blog) {
                return;
            }


            const currentlyPublished =
                Number(blog.is_published) === 1 ||
                blog.is_published === true;


            const newStatus =
                currentlyPublished ? 0 : 1;


            try {

                const response =
                    await fetch(
                        API.UPDATE,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    "Bearer " +
                                    token
                            },

                            body:
                                JSON.stringify({

                                    id: blog.id,

                                    title:
                                        blog.title,

                                    slug:
                                        blog.slug,

                                    summary:
                                        blog.summary,

                                    content:
                                        blog.content,

                                    image_url:
                                        blog.image_url ||
                                        blog.image ||
                                        "",

                                    is_published:
                                        newStatus

                                })
                        }
                    );


                const result =
                    await response.json();


                if (result.success) {

                    await loadBlogs();

                } else {

                    alert(
                        result.message ||
                        "Unable to change blog status."
                    );

                }


            } catch (error) {

                console.error(
                    "Toggle publish error:",
                    error
                );

                alert(
                    "Server error."
                );

            }

        };



    /* ==========================
       DELETE BLOG
    ========================== */

    window.deleteBlog =
        async function(index) {

            const blog =
                blogs[index];

            if (!blog) {
                return;
            }


            const confirmed =
                confirm(
                    "Are you sure you want to delete this blog?"
                );


            if (!confirmed) {
                return;
            }


            try {

                const response =
                    await fetch(
                        API.DELETE,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    "Bearer " +
                                    token
                            },

                            body:
                                JSON.stringify({
                                    id: blog.id
                                })
                        }
                    );


                const result =
                    await response.json();


                if (result.success) {

                    await loadBlogs();

                } else {

                    alert(
                        result.message ||
                        "Unable to delete blog."
                    );

                }


            } catch (error) {

                console.error(
                    "Delete blog error:",
                    error
                );

                alert(
                    "Server error."
                );

            }

        };



    /* ==========================
       DASHBOARD
    ========================== */

    window.goDashboard =
        function() {

            window.location.href =
                "dashboard.html";

        };



    /* ==========================
       LOGOUT
    ========================== */

    window.logout =
        function() {

            localStorage.removeItem(
                "skillitize_admin_token"
            );

            localStorage.removeItem(
                "skillitize_admin"
            );

            window.location.href =
                "index.html";

        };



    /* ==========================
       HTML ESCAPE
    ========================== */

    function escapeHtml(value) {

        if (
            value === null ||
            value === undefined
        ) {
            return "";
        }

        return String(value)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }




    /* ==========================
       RICH TEXT EDITOR
    ========================== */

    const richEditor = document.getElementById("content");
    let savedEditorRange = null;

    function saveEditorSelection() {
        const selection = window.getSelection();
        if (selection && selection.rangeCount > 0 && richEditor.contains(selection.anchorNode)) {
            savedEditorRange = selection.getRangeAt(0).cloneRange();
        }
    }

    function restoreEditorSelection() {
        richEditor.focus();
        if (savedEditorRange) {
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(savedEditorRange);
        }
    }

    richEditor.addEventListener("keyup", saveEditorSelection);
    richEditor.addEventListener("mouseup", saveEditorSelection);
    richEditor.addEventListener("input", saveEditorSelection);

    document.querySelectorAll(".editor-btn[data-command]").forEach((button) => {
        button.addEventListener("mousedown", (e) => e.preventDefault());
        button.addEventListener("click", () => {
            restoreEditorSelection();
            document.execCommand(button.dataset.command, false, null);
            saveEditorSelection();
        });
    });

    document.getElementById("formatBlock").addEventListener("change", function() {
        restoreEditorSelection();
        document.execCommand("formatBlock", false, this.value);
        saveEditorSelection();
        this.value = "p";
    });

    document.getElementById("addLink").addEventListener("mousedown", (e) => e.preventDefault());
    document.getElementById("addLink").addEventListener("click", () => {
        restoreEditorSelection();
        const selection = window.getSelection();
        if (!selection || selection.rangeCount === 0 || selection.toString().trim() === "") {
            alert("First select the text you want to make into a link.");
            return;
        }
        let url = prompt("Enter the full URL (for example: https://skillitize.com):");
        if (!url) return;
        url = url.trim();
        if (!/^(https?:\/\/|mailto:)/i.test(url)) url = "https://" + url;
        document.execCommand("createLink", false, url);
        saveEditorSelection();
    });

    document.getElementById("removeLink").addEventListener("mousedown", (e) => e.preventDefault());
    document.getElementById("removeLink").addEventListener("click", () => {
        restoreEditorSelection();
        document.execCommand("unlink", false, null);
        saveEditorSelection();
    });

    richEditor.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
            e.preventDefault();
            document.getElementById("addLink").click();
        }
    });

    /* Prevent a blank editor from being submitted */
    blogForm.addEventListener("submit", (e) => {
        if (richEditor.innerText.trim() === "") {
            e.preventDefault();
            formMessage.textContent = "Please enter blog content.";
            richEditor.focus();
        }
    }, true);

    /* ==========================
       INITIAL LOAD
    ========================== */

    loadBlogs();

</script>


</body>

</html>
