<body>

```
<!-- ==========================
     HEADER
========================== -->

<header class="header">

    <h1>SKILLITIZE Admin</h1>

    <div class="header-buttons">

        <button
            class="back-btn"
            onclick="goDashboard()">
            Dashboard
        </button>

        <button
            class="logout-btn"
            onclick="logout()">
            Logout
        </button>

    </div>

</header>



<!-- ==========================
     MAIN
========================== -->

<main class="container">


    <div class="page-title">

        <h2>Blog Management</h2>

        <p>
            Create, edit, publish and manage Skillitize articles.
        </p>

    </div>



    <!-- ==========================
         BLOG FORM
    ========================== -->

    <section class="card">

        <h3 id="formTitle">
            Create New Blog
        </h3>


        <form id="blogForm">


            <!-- BLOG ID -->

            <input
                type="hidden"
                id="blogId"
                value="">


            <!-- TITLE -->

            <div class="form-group">

                <label for="title">
                    Blog Title
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Enter blog title"
                    required>

            </div>



            <!-- SLUG -->

            <div class="form-group">

                <label for="slug">
                    Slug
                </label>

                <div class="slug-row">

                    <input
                        type="text"
                        id="slug"
                        placeholder="blog-title"
                        required>

                    <button
                        type="button"
                        class="generate-btn"
                        id="generateSlug">
                        Generate
                    </button>

                </div>

            </div>



            <!-- SUMMARY -->

            <div class="form-group">

                <label for="summary">
                    Summary
                </label>

                <textarea
                    id="summary"
                    placeholder="Short description of the blog"
                    style="min-height:100px;"
                    required></textarea>

            </div>



            <!-- CONTENT -->

            <div class="form-group">

                <label for="content">
                    Blog Content
                </label>

                <textarea
                    id="content"
                    placeholder="Write the complete blog content here..."
                    required></textarea>

            </div>



            <!-- IMAGE -->

            <div class="form-group">

                <label for="imageUrl">
                    Image URL
                </label>

                <input
                    type="url"
                    id="imageUrl"
                    placeholder="https://example.com/image.jpg">

            </div>



            <!-- PUBLISH -->

            <div class="publish-row">

                <input
                    type="checkbox"
                    id="isPublished"
                    checked>

                <label for="isPublished">
                    Publish this article
                </label>

            </div>



            <!-- BUTTONS -->

            <div class="form-buttons">

                <button
                    type="submit"
                    class="save-btn"
                    id="saveButton">
                    Create Blog
                </button>

                <button
                    type="button"
                    class="cancel-btn"
                    id="cancelEdit"
                    style="display:none;">
                    Cancel Edit
                </button>

            </div>


            <div
                class="message"
                id="formMessage">
            </div>


        </form>

    </section>



    <!-- ==========================
         EXISTING BLOGS
    ========================== -->

    <section class="card">

        <h3>
            Existing Blogs
        </h3>


        <div class="blogs-table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            Title
                        </th>

                        <th>
                            Slug
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Date
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                </thead>


                <tbody id="blogsTableBody">

                    <tr>

                        <td
                            colspan="5"
                            class="empty-message">
                            Loading blogs...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>


</main>



<!-- ==========================
     JAVASCRIPT
========================== -->

<script>

    /* ==========================
       API
    ========================== */

    const API_BASE =
        "https://api.skillitize.com";


    const API = {

        GET:
            API_BASE +
            "/blog/get_posts.php",

        CREATE:
            API_BASE +
            "/blog/create_post.php",

        UPDATE:
            API_BASE +
            "/blog/update_post.php",

        DELETE:
            API_BASE +
            "/blog/delete_post.php"

    };


    /* ==========================
       AUTHENTICATION
    ========================== */

    const token =
        localStorage.getItem(
            "skillitize_admin_token"
        );


    if (!token) {

        window.location.href =
            "index.html";

    }


    /* ==========================
       ELEMENTS
    ========================== */

    const blogForm =
        document.getElementById("blogForm");

    const blogId =
        document.getElementById("blogId");

    const title =
        document.getElementById("title");

    const slug =
        document.getElementById("slug");

    const summary =
        document.getElementById("summary");

    const content =
        document.getElementById("content");

    const imageUrl =
        document.getElementById("imageUrl");

    const isPublished =
        document.getElementById("isPublished");

    const blogsTableBody =
        document.getElementById("blogsTableBody");

    const formTitle =
        document.getElementById("formTitle");

    const saveButton =
        document.getElementById("saveButton");

    const cancelEdit =
        document.getElementById("cancelEdit");

    const formMessage =
        document.getElementById("formMessage");


    let blogs = [];



    /* ==========================
       GENERATE SLUG
    ========================== */

    document
        .getElementById("generateSlug")
        .addEventListener("click", () => {

            slug.value =
                createSlug(title.value);

        });


    function createSlug(text) {

        return text
            .toLowerCase()
            .trim()
            .replace(/[^a-z0-9\s-]/g, "")
            .replace(/\s+/g, "-")
            .replace(/-+/g, "-");

    }



    /* ==========================
       LOAD BLOGS
    ========================== */

    async function loadBlogs() {

        try {

            const response =
                await fetch(API.GET, {
                    method: "GET",
                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                });


            if (!response.ok) {

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }


            const result =
                await response.json();


            console.log(
                "Blogs response:",
                result
            );


            if (Array.isArray(result)) {

                blogs = result;

            } else if (
                Array.isArray(result.posts)
            ) {

                blogs = result.posts;

            } else if (
                Array.isArray(result.data)
            ) {

                blogs = result.data;

            } else {

                blogs = [];

            }


            renderBlogs();


        } catch (error) {

            console.error(
                "Load blogs error:",
                error
            );


            blogsTableBody.innerHTML = `
                <tr>
                    <td colspan="5" class="empty-message">
                        Unable to load blogs.
                    </td>
                </tr>
            `;

        }

    }



    /* ==========================
       RENDER BLOGS
    ========================== */

    function renderBlogs() {

        if (blogs.length === 0) {

            blogsTableBody.innerHTML = `
                <tr>
                    <td colspan="5" class="empty-message">
                        No blogs found.
                    </td>
                </tr>
            `;

            return;

        }


        blogsTableBody.innerHTML =
            blogs.map((blog, index) => {

                const published =
                    Number(blog.is_published) === 1 ||
                    blog.is_published === true;


                return `
                    <tr>

                        <td>
                            <strong>
                                ${escapeHtml(blog.title || "")}
                            </strong>
                        </td>

                        <td>
                            ${escapeHtml(blog.slug || "")}
                        </td>

                        <td>

                            <span class="status ${
                                published
                                    ? "published"
                                    : "draft"
                            }">

                                ${
                                    published
                                        ? "Published"
                                        : "Draft"
                                }

                            </span>

                        </td>

                        <td>
                            ${
                                blog.created_at
                                    ? new Date(
                                        blog.created_at
                                      ).toLocaleDateString()
                                    : "-"
                            }
                        </td>

                        <td>

                            <div class="action-buttons">

                                <button
                                    class="edit-btn"
                                    onclick="editBlog(${index})">
                                    Edit
                                </button>

                                <button
                                    class="toggle-btn"
                                    onclick="togglePublish(${index})">

                                    ${
                                        published
                                            ? "Unpublish"
                                            : "Publish"
                                    }

                                </button>

                                <button
                                    class="delete-btn"
                                    onclick="deleteBlog(${index})">
                                    Delete
                                </button>

                            </div>

                        </td>

                    </tr>
                `;

            }).join("");

    }



    /* ==========================
       CREATE / UPDATE BLOG
    ========================== */

    blogForm.addEventListener(
        "submit",
        async (e) => {

            e.preventDefault();


            const editing =
                blogId.value !== "";


            const data = {

                title:
                    title.value.trim(),

                slug:
                    slug.value.trim(),

                summary:
                    summary.value.trim(),

                content:
                    content.value,

                image_url:
                    imageUrl.value.trim(),

                is_published:
                    isPublished.checked ? 1 : 0

            };


            if (editing) {

                data.id =
                    blogId.value;

            }


            saveButton.disabled = true;

            saveButton.textContent =
                editing
                    ? "Updating..."
                    : "Creating...";

            formMessage.textContent = "";


            try {

                const response =
                    await fetch(
                        editing
                            ? API.UPDATE
                            : API.CREATE,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    "Bearer " +
                                    token
                            },

                            body:
                                JSON.stringify(data)
                        }
                    );


                const result =
                    await response.json();


                console.log(
                    "Save blog response:",
                    result
                );


                if (result.success) {

                    formMessage.textContent =
                        editing
                            ? "Blog updated successfully."
                            : "Blog created successfully.";


                    resetForm();

                    await loadBlogs();


                } else {

                    formMessage.textContent =
                        result.message ||
                        "Unable to save blog.";

                }


            } catch (error) {

                console.error(
                    "Save blog error:",
                    error
                );


                formMessage.textContent =
                    "Server error. Please try again.";

            }


            saveButton.disabled = false;

            saveButton.textContent =
                "Create Blog";

        }
    );



    /* ==========================
       EDIT BLOG
    ========================== */

    window.editBlog =
        function(index) {

            const blog =
                blogs[index];

            if (!blog) {
                return;
            }


            blogId.value =
                blog.id || "";

            title.value =
                blog.title || "";

            slug.value =
                blog.slug || "";

            summary.value =
                blog.summary || "";

            content.value =
                blog.content || "";

            imageUrl.value =
                blog.image_url ||
                blog.image ||
                "";

            isPublished.checked =
                Number(blog.is_published) === 1 ||
                blog.is_published === true;


            formTitle.textContent =
                "Edit Blog";

            saveButton.textContent =
                "Update Blog";

            cancelEdit.style.display =
                "inline-block";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        };



    /* ==========================
       CANCEL EDIT
    ========================== */

    cancelEdit.addEventListener(
        "click",
        () => {

            resetForm();

        }
    );



    function resetForm() {

        blogForm.reset();

        blogId.value = "";

        isPublished.checked = true;

        formTitle.textContent =
            "Create New Blog";

        saveButton.textContent =
            "Create Blog";

        cancelEdit.style.display =
            "none";

    }



    /* ==========================
       PUBLISH / UNPUBLISH
    ========================== */

    window.togglePublish =
        async function(index) {

            const blog =
                blogs[index];

            if (!blog) {
                return;
            }


            const currentlyPublished =
                Number(blog.is_published) === 1 ||
                blog.is_published === true;


            const newStatus =
                currentlyPublished ? 0 : 1;


            try {

                const response =
                    await fetch(
                        API.UPDATE,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    "Bearer " +
                                    token
                            },

                            body:
                                JSON.stringify({

                                    id: blog.id,

                                    title:
                                        blog.title,

                                    slug:
                                        blog.slug,

                                    summary:
                                        blog.summary,

                                    content:
                                        blog.content,

                                    image_url:
                                        blog.image_url ||
                                        blog.image ||
                                        "",

                                    is_published:
                                        newStatus

                                })
                        }
                    );


                const result =
                    await response.json();


                if (result.success) {

                    await loadBlogs();

                } else {

                    alert(
                        result.message ||
                        "Unable to change blog status."
                    );

                }


            } catch (error) {

                console.error(
                    "Toggle publish error:",
                    error
                );

                alert(
                    "Server error."
                );

            }

        };



    /* ==========================
       DELETE BLOG
    ========================== */

    window.deleteBlog =
        async function(index) {

            const blog =
                blogs[index];

            if (!blog) {
                return;
            }


            const confirmed =
                confirm(
                    "Are you sure you want to delete this blog?"
                );


            if (!confirmed) {
                return;
            }


            try {

                const response =
                    await fetch(
                        API.DELETE,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    "Bearer " +
                                    token
                            },

                            body:
                                JSON.stringify({
                                    id: blog.id
                                })
                        }
                    );


                const result =
                    await response.json();


                if (result.success) {

                    await loadBlogs();

                } else {

                    alert(
                        result.message ||
                        "Unable to delete blog."
                    );

                }


            } catch (error) {

                console.error(
                    "Delete blog error:",
                    error
                );

                alert(
                    "Server error."
                );

            }

        };



    /* ==========================
       DASHBOARD
    ========================== */

    window.goDashboard =
        function() {

            window.location.href =
                "dashboard.html";

        };



    /* ==========================
       LOGOUT
    ========================== */

    window.logout =
        function() {

            localStorage.removeItem(
                "skillitize_admin_token"
            );

            localStorage.removeItem(
                "skillitize_admin"
            );

            window.location.href =
                "index.html";

        };



    /* ==========================
       HTML ESCAPE
    ========================== */

    function escapeHtml(value) {

        if (
            value === null ||
            value === undefined
        ) {
            return "";
        }

        return String(value)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }



    /* ==========================
       INITIAL LOAD
    ========================== */

    loadBlogs();

</script>
