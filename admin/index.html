<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Skillitize Admin Login</title>

    <link rel="stylesheet" href="admin.css">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                SKILLITIZE
            </div>

            <h1>Admin Login</h1>

            <p class="subtitle">
                Sign in to manage your website
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="admin@skillitize.com"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    id="loginButton"
                >
                    Login
                </button>

                <p
                    id="loginMessage"
                    class="login-message"
                ></p>

            </form>

        </div>

    </div>

    <script src="admin.js"></script>

</body>

</html>
