 
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skillitize Website Data</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#222}
header{background:linear-gradient(135deg,#2563eb,#7c3aed);color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:23px}
button,select,input{font:inherit}
button{cursor:pointer;border:0;border-radius:7px;padding:10px 14px}
.header-btn{background:white;color:#333}
main{max-width:1200px;margin:30px auto;padding:0 18px}
.panel{background:white;padding:22px;border-radius:12px;box-shadow:0 3px 15px #0000000d;margin-bottom:20px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0}
.toolbar input{flex:1;min-width:180px}
input,select{padding:11px;border:1px solid #d7dce5;border-radius:7px}
.tabs{display:flex;gap:10px;flex-wrap:wrap}
.tab{background:#e9edff;color:#263c91}
.tab.active{background:#2563eb;color:white}
.status{margin:12px 0;color:#555}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{text-align:left;padding:12px;border-bottom:1px solid #edf0f5;vertical-align:top;overflow-wrap:anywhere}
th{background:#f8f9fc}
.empty{text-align:center;padding:30px;color:#666}
@media(max-width:600px){header{padding:16px}main{padding:0 12px}.panel{padding:15px}}
</style>
</head>
<body>
<header>
  <h1>SKILLITIZE — Website Data</h1>
  <div>
    <button class="header-btn" id="dashboardBtn">Dashboard</button>
    <button class="header-btn" id="logoutBtn">Logout</button>
  </div>
</header>

<main>
  <section class="panel">
    <h2>Website Submissions</h2>
    <p>View career guidance enquiries and contact messages saved on the website.</p>

    <div class="tabs">
      <button class="tab active" data-table="forms">Career Guidance</button>
      <button class="tab" data-table="contacts">Contact Messages</button>
    </div>

    <div class="toolbar">
      <input id="searchInput" type="search" placeholder="Search displayed records...">
      <button id="refreshBtn" style="background:#2563eb;color:white">Refresh</button>
    </div>

    <p id="status" class="status" role="status">Loading data...</p>
    <div class="table-wrap">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="tableBody">
          <tr><td class="empty">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<script>
const API_BASE = "https://api.skillitize.com";
const DATA_API = API_BASE + "/admin/get_website_data.php";

const token = localStorage.getItem("skillitize_admin_token");

if (!token) {
  window.location.replace("index.html");
}

let currentTable = "forms";
let records = [];

const configs = {
  forms: {
    label: "Career guidance submissions",
    columns: [
      ["id", "ID"],
      ["name", "Name"],
      ["email", "Email"],
      ["phone", "Phone"],
      ["college", "College"],
      ["college_course", "Degree/Course"],
      ["course", "Interested Course"],
      ["message", "Message"],
      ["created_at", "Submitted At"]
    ]
  },
  contacts: {
    label: "Contact messages",
    columns: [
      ["id", "ID"],
      ["name", "Name"],
      ["email", "Email"],
      ["phone", "Phone"],
      ["message", "Message"],
      ["created_at", "Submitted At"]
    ]
  }
};

const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, ch => ({
  "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
}[ch]));

async function loadData() {
  const status = document.getElementById("status");
  const body = document.getElementById("tableBody");

  status.textContent = "Loading " + configs[currentTable].label + "...";
  body.innerHTML = '<tr><td class="empty">Loading...</td></tr>';

  try {
    const response = await fetch(DATA_API + "?table=" + encodeURIComponent(currentTable), {
      method: "GET",
      headers: {
        "Authorization": "Bearer " + token,
        "Accept": "application/json"
      }
    });

    const result = await response.json().catch(() => ({}));

    if (response.status === 401 || response.status === 403) {
      status.textContent = "Your session is invalid or expired. Please log in again.";
      localStorage.removeItem("skillitize_admin_token");
      localStorage.removeItem("skillitize_admin");
      setTimeout(() => window.location.replace("index.html"), 1200);
      return;
    }

    if (!response.ok || result.success === false) {
      throw new Error(result.message || "Request failed (HTTP " + response.status + ")");
    }

    records = Array.isArray(result.data) ? result.data : [];
    renderTable();
  } catch (error) {
    console.error("Website data error:", error);
    document.getElementById("tableHead").innerHTML = "";
    body.innerHTML = '<tr><td class="empty">Unable to load data. Check the API URL, server response and CORS settings.</td></tr>';
    status.textContent = error.message || "Unable to load data.";
  }
}

function renderTable() {
  const config = configs[currentTable];
  const query = document.getElementById("searchInput").value.trim().toLowerCase();
  const filtered = records.filter(row =>
    Object.values(row).some(value => String(value ?? "").toLowerCase().includes(query))
  );

  document.getElementById("tableHead").innerHTML =
    "<tr>" + config.columns.map(([, label]) => "<th>" + escapeHtml(label) + "</th>").join("") + "</tr>";

  document.getElementById("tableBody").innerHTML = filtered.length
    ? filtered.map(row => "<tr>" + config.columns.map(([key]) =>
        "<td>" + escapeHtml(row[key]) + "</td>"
      ).join("") + "</tr>").join("")
    : '<tr><td class="empty" colspan="' + config.columns.length + '">No records found.</td></tr>';

  document.getElementById("status").textContent =
    filtered.length + " record(s) shown · " + records.length + " total loaded";
}

document.querySelectorAll(".tab").forEach(button => {
  button.addEventListener("click", () => {
    currentTable = button.dataset.table;
    document.querySelectorAll(".tab").forEach(tab =>
      tab.classList.toggle("active", tab === button)
    );
    document.getElementById("searchInput").value = "";
    loadData();
  });
});

document.getElementById("searchInput").addEventListener("input", renderTable);
document.getElementById("refreshBtn").addEventListener("click", loadData);
document.getElementById("dashboardBtn").addEventListener("click", () => {
  window.location.href = "dashboard.html";
});
document.getElementById("logoutBtn").addEventListener("click", () => {
  localStorage.removeItem("skillitize_admin_token");
  localStorage.removeItem("skillitize_admin");
  window.location.href = "index.html";
});

if (token) loadData();
</script>
</body>
</html>
