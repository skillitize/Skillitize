```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skillitize Website Data</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #222;
}

header {
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  color: white;
  padding: 20px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

header h1 {
  margin: 0;
  font-size: 23px;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
  border: 0;
  border-radius: 7px;
  padding: 10px 14px;
}

button:disabled {
  opacity: 0.6;
  cursor: wait;
}

.header-btn {
  background: white;
  color: #333;
}

main {
  max-width: 1500px;
  margin: 30px auto;
  padding: 0 18px;
}

.panel {
  background: white;
  padding: 22px;
  border-radius: 12px;
  box-shadow: 0 3px 15px #0000000d;
  margin-bottom: 20px;
}

.tabs {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin: 22px 0;
}

.tab {
  background: white;
  color: #263c91;
  border: 1px solid #dce3f4;
  min-height: 64px;
  padding: 14px 12px;
  font-weight: 600;
  text-align: left;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}

.tab:hover {
  border-color: #2563eb;
  background: #f0f4ff;
}

.tab.active {
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  color: white;
  border-color: transparent;
}

.toolbar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  margin: 18px 0;
}

.toolbar input {
  flex: 1;
  min-width: 200px;
}

input {
  padding: 11px;
  border: 1px solid #d7dce5;
  border-radius: 7px;
}

input:focus {
  outline: 2px solid #c7d2fe;
  border-color: #6366f1;
}

.primary-btn {
  background: #2563eb;
  color: white;
}

.primary-btn:hover {
  background: #1d4ed8;
}

.status {
  margin: 12px 0;
  color: #555;
  font-size: 14px;
  overflow-wrap: anywhere;
}

.table-wrap {
  overflow: auto;
  max-height: 70vh;
  border: 1px solid #edf0f5;
  border-radius: 8px;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 700px;
}

th, td {
  text-align: left;
  padding: 12px;
  border-bottom: 1px solid #edf0f5;
  vertical-align: top;
  overflow-wrap: anywhere;
  max-width: 400px;
}

/* Keep ID values on a single line */
th:first-child,
td:first-child {
  min-width: 65px;
  width: 65px;
  white-space: nowrap;
  overflow-wrap: normal;
}

th {
  background: #f8f9fc;
  position: sticky;
  top: 0;
  z-index: 1;
  white-space: nowrap;
}

tbody tr:hover {
  background: #fafbff;
}

.empty {
  text-align: center;
  padding: 30px;
  color: #666;
}

@media (max-width: 850px) {
  .tabs {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 600px) {
  header {
    padding: 16px;
  }

  header h1 {
    font-size: 20px;
  }

  main {
    padding: 0 12px;
    margin: 18px auto;
  }

  .panel {
    padding: 15px;
  }

  .tabs {
    gap: 8px;
  }

  .tab {
    min-height: 54px;
    font-size: 13px;
    padding: 11px 9px;
  }

  .toolbar input {
    min-width: 100%;
  }
}
</style>
</head>

<body>

<header>
  <h1>SKILLITIZE — Website Data</h1>

  <div>
    <button class="header-btn" id="dashboardBtn">Dashboard</button>
    <button class="header-btn" id="logoutBtn">Logout</button>
  </div>
</header>

<main>
  <section class="panel">
    <h2>Website Database Records</h2>

    <p>
      Select a category below to view saved records and all available columns.
    </p>

    <div class="tabs" id="tableTabs">
      <button class="tab active" data-table="bookings">
        Bookings
      </button>

      <button class="tab" data-table="career_applications">
        Career Applications
      </button>

      <button class="tab" data-table="contacts">
        Contact Submissions
      </button>

      <button class="tab" data-table="forms">
        Form Submissions
      </button>
    </div>

    
<div class="toolbar">
  <input
    id="searchInput"
    type="search"
    placeholder="Search all columns..."
    aria-label="Search records"
  >

  <button class="primary-btn" id="refreshBtn">
    Refresh
  </button>

  <button class="primary-btn" id="exportCsvBtn">
    Export CSV
  </button>

</div>


    <p id="status" class="status" role="status" aria-live="polite">
      Loading bookings...
    </p>

    <div class="table-wrap">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="tableBody">
          <tr>
            <td class="empty">Loading records...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<script>
"use strict";

const DATA_API = "https://api.skillitize.com/admin/get_website_data.php";

const tableLabels = {
  bookings: "Bookings",
  career_applications: "Career Applications",
  contacts: "Contact Submissions",
  forms: "Form Submissions"
};

let currentTable = "bookings";
let records = [];
let requestNumber = 0;

const statusElement = document.getElementById("status");
const tableHead = document.getElementById("tableHead");
const tableBody = document.getElementById("tableBody");
const searchInput = document.getElementById("searchInput");
const refreshBtn = document.getElementById("refreshBtn");

function getToken() {
  return localStorage.getItem("skillitize_admin_token");
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[character]));
}

function formatColumnName(key) {
  return key
    .replace(/([a-z0-9])([A-Z])/g, "$1 $2")
    .replace(/_/g, " ")
    .replace(/\s+/g, " ")
    .trim()
    .replace(/\b\w/g, character => character.toUpperCase());
}

function showMessage(message) {
  tableHead.innerHTML = "";

  tableBody.innerHTML =
    '<tr><td class="empty">' +
    escapeHtml(message) +
    "</td></tr>";
}

function clearSessionAndRedirect() {
  localStorage.removeItem("skillitize_admin_token");
  localStorage.removeItem("skillitize_admin");
  window.location.replace("index.html");
}

async function loadData() {
  const token = getToken();

  if (!token) {
    clearSessionAndRedirect();
    return;
  }

  const thisRequest = ++requestNumber;
  const requestedTable = currentTable;

  refreshBtn.disabled = true;
  statusElement.textContent =
    "Loading " + tableLabels[requestedTable] + "...";

  showMessage("Loading records...");

  try {
    const response = await fetch(
      DATA_API + "?table=" + encodeURIComponent(requestedTable),
      {
        method: "GET",
        headers: {
          "Authorization": "Bearer " + token,
          "Accept": "application/json"
        },
        cache: "no-store"
      }
    );

    // Read the response as text first so non-JSON PHP errors
    // can be diagnosed instead of being silently discarded.
    const responseText = await response.text();

    if (thisRequest !== requestNumber) return;

    let result = null;

    try {
      result = JSON.parse(responseText);
    } catch (parseError) {
      console.error(
        "API returned non-JSON content.",
        "HTTP status:",
        response.status,
        "Response:",
        responseText.slice(0, 1500)
      );

      throw new Error(
        "The API returned an invalid JSON response (HTTP " +
        response.status +
        "). Check the browser console for details."
      );
    }

    console.log("Website data API:", {
      table: requestedTable,
      status: response.status,
      response: result
    });

    if (thisRequest !== requestNumber) return;

    if (response.status === 401 || response.status === 403) {
      statusElement.textContent =
        "Session expired. Please log in again.";

      clearSessionAndRedirect();
      return;
    }

    if (!response.ok) {
      throw new Error(
        result?.message ||
        "API request failed (HTTP " + response.status + ")."
      );
    }

    if (
  !result ||
  result.success !== true ||
  !Array.isArray(result.data)
) {
  console.error("Unexpected API response structure:", {
    requestedTable,
    httpStatus: response.status,
    responseBody: result,
    responseText: responseText
  });

  throw new Error(
    "Unexpected API response. Check Console for responseBody."
  );
}

    records = result.data;
    renderTable();

  } catch (error) {
    if (thisRequest !== requestNumber) return;

    console.error("Website data error:", error);

    records = [];
    showMessage(error.message || "Unable to load records.");

    statusElement.textContent =
      "Unable to load " + tableLabels[requestedTable] +
      ". " + (error.message || "Please try again.");
  } finally {
    if (thisRequest === requestNumber) {
      refreshBtn.disabled = false;
    }
  }
}

function renderTable() {
  const query = searchInput.value.trim().toLowerCase();

  const filtered = records.filter(row =>
    Object.values(row).some(value =>
      String(value ?? "").toLowerCase().includes(query)
    )
  );

  // Discover all fields dynamically from the returned records.
  const columns = records.length
    ? [...new Set(records.flatMap(row => Object.keys(row)))]
    : [];

  if (columns.length === 0) {
    tableHead.innerHTML = "";
    showMessage("No records found in this table.");

    statusElement.textContent = "0 records found.";
    return;
  }

  tableHead.innerHTML =
    "<tr>" +
    columns.map(key =>
      "<th>" + escapeHtml(formatColumnName(key)) + "</th>"
    ).join("") +
    "</tr>";

  if (filtered.length === 0) {
    tableBody.innerHTML =
      '<tr><td class="empty" colspan="' + columns.length +
      '">No matching records found.</td></tr>';
  } else {
    tableBody.innerHTML = filtered.map(row =>
      "<tr>" +
      columns.map(key =>
        "<td>" + escapeHtml(row[key]) + "</td>"
      ).join("") +
      "</tr>"
    ).join("");
  }

  statusElement.textContent =
    filtered.length + " record(s) shown · " +
    records.length + " total loaded";
}

// Category selection.
document.querySelectorAll(".tab").forEach(button => {
  button.addEventListener("click", () => {
    const selectedTable = button.dataset.table;

    if (!tableLabels[selectedTable]) return;
    if (selectedTable === currentTable) return;

    currentTable = selectedTable;
    records = [];

    document.querySelectorAll(".tab").forEach(tab => {
      tab.classList.toggle("active", tab === button);
    });

    searchInput.value = "";
    loadData();
  });
});

// Search across every returned field.
searchInput.addEventListener("input", renderTable);

// Refresh the selected category.
refreshBtn.addEventListener("click", loadData);

// Dashboard navigation.
document.getElementById("dashboardBtn").addEventListener("click", () => {
  window.location.href = "dashboard.html";
});

// Logout.
document.getElementById("logoutBtn").addEventListener("click", () => {
  clearSessionAndRedirect();
});


function getFilteredRecords() {
  const query = document
    .getElementById("searchInput")
    .value.trim()
    .toLowerCase();

  return records.filter(row =>
    Object.values(row).some(value =>
      String(value ?? "").toLowerCase().includes(query)
    )
  );
}

function downloadFile(content, filename, mimeType) {
  const blob = new Blob(["\uFEFF" + content], {
    type: mimeType
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = filename;

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportRecords(format) {
  const filtered = getFilteredRecords();

  if (filtered.length === 0) {
    alert("No records available to export.");
    return;
  }

  const columns = [
    ...new Set(filtered.flatMap(row => Object.keys(row)))
  ];

  // Escape CSV fields correctly, including commas and quotes.
  const escapeCsv = value =>
    '"' + String(value ?? "").replace(/"/g, '""') + '"';

  const csv = [
    columns.map(escapeCsv).join(","),
    ...filtered.map(row =>
      columns.map(column => escapeCsv(row[column])).join(",")
    )
  ].join("\r\n");

  const date = new Date().toISOString().slice(0, 10);
  const filename = `skillitize_${currentTable}_${date}`;

  if (format === "csv") {
    downloadFile(
      csv,
      filename + ".csv",
      "text/csv;charset=utf-8;"
    );
  } else {
    // CSV opens directly in Microsoft Excel.
    downloadFile(
      csv,
      filename + ".csv",
      "application/vnd.ms-excel;charset=utf-8;"
    );
  }
}

document.getElementById("exportCsvBtn")
  .addEventListener("click", () => exportRecords("csv"));

document.getElementById("exportExcelBtn")
  .addEventListener("click", () => exportRecords("excel"));


// Initial load.
loadData();
</script>

</body>
</html>
