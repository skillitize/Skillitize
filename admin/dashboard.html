<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Skillitize Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .header {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .logout-btn {
            background: white;
            color: #333;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .welcome {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .welcome h2 {
            margin-top: 0;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin-top: 0;
        }

        .card button {
            margin-top: 10px;
            padding: 10px 15px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header class="header">

        <h1>SKILLITIZE Admin</h1>

        <button
            class="logout-btn"
            id="logoutButton"
        >
            Logout
        </button>

    </header>


    <main class="container">

        <section class="welcome">

            <h2>Welcome to Admin Dashboard</h2>

            <p id="adminInfo">
                Loading admin information...
            </p>

        </section>


        <section class="cards">

            <div class="card">

                <h3>📝 Blog Management</h3>

                <p>
                    Create, edit and manage Skillitize blog posts.
                </p>

                <button id="blogButton">
                    Manage Blog
                </button>

            </div>


            <div class="card">

                <h3>📊 Website Data</h3>

                <p>
                    View website and submission information.
                </p>

                <button>
                    View Data
                </button>

            </div>


            <div class="card">

                <h3>👤 Admin Account</h3>

                <p>
                    Manage your administrator account.
                </p>

                <button>
                    Account Settings
                </button>

            </div>

        </section>

    </main>


    <script>

        document.addEventListener("DOMContentLoaded", () => {

            const token =
                localStorage.getItem(
                    "skillitize_admin_token"
                );

            const adminData =
                localStorage.getItem(
                    "skillitize_admin"
                );


            // No login token = return to login page
            if (!token) {

                window.location.href = "index.html";

                return;
            }


            // Display admin information
            if (adminData) {

                try {

                    const admin =
                        JSON.parse(adminData);

                    const email =
                        admin.email || "Administrator";

                    document.getElementById(
                        "adminInfo"
                    ).textContent =
                        "Logged in as: " + email;

                } catch (error) {

                    document.getElementById(
                        "adminInfo"
                    ).textContent =
                        "Administrator";

                }

            }


            // Logout
            document.getElementById(
                "logoutButton"
            ).addEventListener("click", () => {

                localStorage.removeItem(
                    "skillitize_admin_token"
                );

                localStorage.removeItem(
                    "skillitize_admin"
                );

                window.location.href =
                    "index.html";

            });


            // Blog button
            document.getElementById(
                "blogButton"
            ).addEventListener("click", () => {

                window.location.href =
                    "blog.html";

            });

        });

    </script>

</body>

</html>
