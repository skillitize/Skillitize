<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Skillitize Blog</title>

    <meta name="description"
          content="Skillitize career insights and technology guides.">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f8fc;
            color: #222;
            line-height: 1.7;
        }

        /* ==========================
           HEADER
        ========================== */

        

        /* ==========================
           ARTICLE
        ========================== */

        .blog-wrapper {
            max-width: 900px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .blog-article {
            background: white;
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
        }

        .blog-title {
            font-size: 42px;
            line-height: 1.2;
            margin-bottom: 15px;
            color: #111827;
        }

        .blog-date {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .blog-image {
            width: 100%;
            max-height: 480px;
            object-fit: cover;
            border-radius: 14px;
            margin-bottom: 30px;
        }

        .blog-summary {
            font-size: 19px;
            font-weight: 500;
            color: #555;
            margin-bottom: 30px;
        }

        .blog-content {
            font-size: 17px;
            color: #333;
        }

        .blog-content p {
            margin-bottom: 20px;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 25px;
            text-decoration: none;
            color: #4f46e5;
            font-weight: 600;
        }

        /* ==========================
           LOADING
        ========================== */

        .loading {
            text-align: center;
            padding: 80px 20px;
            font-size: 18px;
        }

        /* ==========================
           ERROR
        ========================== */

        .error {
            text-align: center;
            padding: 80px 20px;
        }

        .error h2 {
            margin-bottom: 10px;
        }

        .error a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #4f46e5;
            font-weight: 600;
        }

        /* ==========================
           MOBILE
        ========================== */

        @media (max-width: 768px) {

            .blog-wrapper {
                margin: 25px auto;
            }

            .blog-article {
                padding: 25px;
            }

            .blog-title {
                font-size: 30px;
            }

            .blog-summary {
                font-size: 17px;
            }

            .blog-content {
                font-size: 16px;
            }

        }

    </style>

</head>


<body>


    <!-- ==========================
         HEADER
    ========================== -->

    <head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Courses | Skillitize</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial, Helvetica, sans-serif; background: #f7f9fc; color: #1b1b1b; line-height: 1.6; }
a { text-decoration: none; }
.header { width: 100%; min-height: 80px; padding: 0 6%; background: #fafbfc; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1000; }
.logo-container img { width: 150px; height: auto; display: block; }
.nav ul { list-style: none; display: flex; align-items: center; gap: 30px; }
.nav ul li a { color: #020202; font-size: 15px; font-weight: 500; transition: 0.3s; }
.nav ul li a:hover { color: #7c3aed; }
.hero-btn { display: inline-block; padding: 12px 22px; border-radius: 7px; background: #7c3aed; color: #ffffff; font-size: 14px; font-weight: 600; transition: 0.3s; }
.hero-btn:hover { background: #6d28d9; transform: translateY(-2px); }
.hamburger { display: none; background: transparent; border: none; cursor: pointer; }
.hamburger span { display: block; width: 25px; height: 3px; background: #020202; margin: 5px 0; border-radius: 5px; }
.courses-hero { background: linear-gradient(135deg, #9da2ad 0%, #312e81 50%, #4c1d95 100%); padding: 90px 7%; text-align: center; color: #ffffff; }
.courses-hero .small-title { color: #c4b5fd; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; }
.courses-hero h1 { font-size: 48px; line-height: 1.15; margin-bottom: 20px; }
.courses-hero p { max-width: 700px; margin: auto; color: #e5e7eb; font-size: 17px; }
.courses-section { padding: 80px 7%; }
.section-heading { text-align: center; margin-bottom: 50px; }
.section-heading h2 { font-size: 36px; color: #111827; margin-bottom: 10px; }
.section-heading p { color: #6b7280; font-size: 16px; }
.courses-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
.course-card { background: #ffffff; border-radius: 16px; overflow: hidden; border: 1px solid #e5e7eb; box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06); transition: 0.3s ease; display: flex; flex-direction: column; }
.course-card:hover { transform: translateY(-8px); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.10); }
.course-image { height: 210px; width: 100%; overflow: hidden; position: relative; }
.limited-offer-badge { display: inline-block; width: fit-content; background: #dc2626; color: #ffffff; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 5px 12px; border-radius: 20px; margin-bottom: 12px; margin-left: 8px; }
.course-image img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
.course-card:hover .course-image img { transform: scale(1.05); }
.course-content { padding: 25px; display: flex; flex-direction: column; flex: 1; }
.course-category { display: inline-block; width: fit-content; background: #ede9fe; color: #6d28d9; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-bottom: 12px; }
.course-content h3 { font-size: 22px; color: #111827; margin-bottom: 12px; line-height: 1.3; }
.course-description { color: #6b7280; font-size: 14px; line-height: 1.7; margin-bottom: 20px; }
.course-meta { display: flex; gap: 18px; flex-wrap: wrap; padding-bottom: 20px; margin-bottom: 20px; border-bottom: 1px solid #e5e7eb; color: #6b7280; font-size: 13px; }
.course-meta span { display: flex; align-items: center; gap: 5px; }
.course-footer { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 15px; }
.course-price { color: #111827; }
.course-price .current-price { display: block; font-size: 24px; font-weight: 800; }
.course-price .old-price { font-size: 13px; color: #e00404; text-decoration: line-through; }
.know-more-btn { display: inline-block; padding: 11px 18px; background: #7c3aed; color: #ffffff; border-radius: 7px; font-size: 13px; font-weight: 700; transition: 0.3s; }
.know-more-btn:hover { background: #6d28d9; }
.courses-cta { margin: 0 7% 80px; padding: 60px 40px; border-radius: 20px; background: #111827; color: #ffffff; text-align: center; }
.courses-cta h2 { font-size: 32px; margin-bottom: 12px; }
.courses-cta p { color: #d1d5db; max-width: 600px; margin: 0 auto 25px; }

/* ===== FOOTER — matched to index.html ===== */
footer{
  background:#111827;
  color:#fff;
  padding:70px 8% 30px;
}
.footer-container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:40px;
  margin-bottom:40px;
}
footer h3,
footer h4{
  margin-bottom:16px;
  font-weight:700;
}
footer p,
footer a{
  color:#cbd5e1;
  line-height:1.8;
}
footer a{
  display:block;
  margin-bottom:10px;
}
.copy{
  text-align:center;
  color:#94a3b8;
  border-top:1px solid rgba(255,255,255,0.08);

}
.social-icons{

}
.social-icons a{

@media (max-width: 1000px) {
.courses-grid { grid-template-columns: repeat(2, 1fr); }
.nav ul { gap: 18px; }
.header { padding: 0 4%; }
}
@media (max-width: 750px) {
.header { min-height: 70px; }
.nav { display: none; position: absolute; top: 70px; left: 0; width: 100%; background: #ebecee; padding: 20px; }
.nav.active { display: block; }
.nav ul { flex-direction: column; gap: 18px; }
.header-btns { display: none; }
.hamburger { display: block; }
.courses-hero { padding: 65px 6%; }
.courses-hero h1 { font-size: 36px; }

.courses-grid { grid-template-columns: 1fr; }
.courses-cta { margin: 0 6% 60px; }
}
@media (max-width: 480px) {
.logo-container img { width: 125px; }
.courses-hero h1 { font-size: 31px; }
.section-heading h2 { font-size: 29px; }
.course-content { padding: 20px; }
.course-footer { align-items: flex-end; }
.course-price .current-price { font-size: 21px; }
.know-more-btn { padding: 10px 14px; }
}
</style>

<body>
<header class="header">
  <div class="logo-container">

  </div>

  <nav class="nav" id="main-nav">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="#courses-section">Courses</a></li>

      <li><a href="index.html#contact">Contact</a></li>
      <li><a href="index.html#testimonials">Testimonials</a></li>
    </ul>
  </nav>

  <div class="header-btns">
    <a href="course.html" class="hero-btn">
      Get Started
    </a>
  </div>

  <!-- Hamburger button (visible only on mobile via CSS) -->
  <button class="hamburger" aria-label="Toggle menu" aria-expanded="false">
    <span></span>

</header>



    <!-- ==========================
         BLOG
    ========================== -->

    <main class="blog-wrapper">

        <a href="index.html#blogs"
           class="back-btn">
            ← Back to Articles
        </a>


        <!-- Loading -->

        <div id="loading"
             class="loading">

            Loading article...

        </div>


        <!-- Error -->

        <div id="error"
             class="error"
             style="display:none;">

            <h2>
                Article not found
            </h2>

            <p>
                The article you're looking for could not be loaded.
            </p>

            <a href="index.html#blogs">
                ← Back to Articles
            </a>

        </div>


        <!-- Article -->

        <article id="blogArticle"
                 class="blog-article"
                 style="display:none;">

            <h1 id="blogTitle"
                class="blog-title">
            </h1>


            <div id="blogDate"
                 class="blog-date">
            </div>


            <img id="blogImage"
                 class="blog-image"
                 style="display:none;"
                 alt="">


            <div id="blogSummary"
                 class="blog-summary">
            </div>


            <div id="blogContent"
                 class="blog-content">
            </div>

        </article>

    </main>



    <!-- ==========================
         BLOG JAVASCRIPT
    ========================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            loadBlog
        );


        async function loadBlog() {

            const loading =
                document.getElementById("loading");

            const error =
                document.getElementById("error");

            const article =
                document.getElementById("blogArticle");


            try {

                /*
                 * Get slug from URL
                 *
                 * Example:
                 *
                 * blog.html?slug=data-analytics
                 */

                const params =
                    new URLSearchParams(
                        window.location.search
                    );


                const slug =
                    params.get("slug");


                /*
                 * Check slug
                 */

                if (!slug) {

                    throw new Error(
                        "No blog slug provided."
                    );

                }


                console.log(
                    "Loading blog slug:",
                    slug
                );


                /*
                 * Get blogs from API
                 */

                const response =
                    await fetch(
                        "https://api.skillitize.com/blog/get_posts.php"
                    );


                if (!response.ok) {

                    throw new Error(
                        "API returned HTTP " +
                        response.status
                    );

                }


                const data =
                    await response.json();


                console.log(
                    "Blog API:",
                    data
                );


                /*
                 * Validate API
                 */

                if (
                    !data ||
                    data.success !== true ||
                    !Array.isArray(data.posts)
                ) {

                    throw new Error(
                        "Invalid API response."
                    );

                }


                /*
                 * Find requested blog
                 */

                const blog =
                    data.posts.find(
                        post =>
                            post.slug === slug
                    );


                /*
                 * Blog doesn't exist
                 */

                if (!blog) {

                    throw new Error(
                        "Blog not found."
                    );

                }


                /*
                 * TITLE
                 */

                document.getElementById(
                    "blogTitle"
                ).textContent =
                    blog.title ||
                    "Untitled Article";


                /*
                 * DATE
                 */

                const dateElement =
                    document.getElementById(
                        "blogDate"
                    );


                if (blog.created_at) {

                    const date =
                        new Date(
                            blog.created_at
                        );


                    dateElement.textContent =
                        date.toLocaleDateString(
                            "en-IN",
                            {
                                day: "numeric",
                                month: "long",
                                year: "numeric"
                            }
                        );

                } else {

                    dateElement.textContent = "";

                }


                /*
                 * IMAGE
                 */

                const image =
                    document.getElementById(
                        "blogImage"
                    );


                if (blog.image_url) {

                    image.src =
                        blog.image_url;

                    image.alt =
                        blog.title ||
                        "Skillitize Blog";

                    image.style.display =
                        "block";

                }


                /*
                 * SUMMARY
                 */

                document.getElementById(
                    "blogSummary"
                ).textContent =
                    blog.summary || "";


                /*
                 * CONTENT
                 *
                 * Your API stores paragraphs
                 * separated by new lines.
                 */

                const content =
                    document.getElementById(
                        "blogContent"
                    );


                content.innerHTML = "";


                const paragraphs =
                    (blog.content || "")
                        .split(/\n\s*\n/);


                paragraphs.forEach(
                    paragraph => {

                        if (
                            paragraph.trim()
                        ) {

                            const p =
                                document.createElement(
                                    "p"
                                );


                            p.textContent =
                                paragraph.trim();


                            content.appendChild(p);

                        }

                    }
                );


                /*
                 * Update browser title
                 */

                document.title =
                    blog.title +
                    " | Skillitize";


                /*
                 * Show article
                 */

                loading.style.display =
                    "none";

                article.style.display =
                    "block";


            } catch (err) {

                console.error(
                    "Blog Loading Error:",
                    err
                );


                loading.style.display =
                    "none";

                error.style.display =
                    "block";

            }

        }

    </script>


</body>

</html>
